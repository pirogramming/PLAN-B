{# 사용법: task_review.html 에서 {% include "exams/partials/_task_modal.html" %}
API 명세서.pdf 계약대로 fetch 로 처리 (페이지 이동 없음).
주의: /exams/tasks/create/, /update/, /delete/ 는 문서상 "구현 상태: 연결 전" —
BE3가 실제 뷰를 만들기 전까진 호출 시 404 남. #}
<div class="modal-backdrop" id="task-modal">
    <div class="modal">
        <div style="font-size:16px; font-weight:700; margin-bottom:2px;" id="task-modal-title">작업 추가</div>
        <div style="font-size:12px; color:var(--neutral7); margin-bottom:20px;" id="task-modal-subject"></div>

        <div class="form-group">
            <label class="form-label">단원명</label>
            <input type="text" class="form-control" id="task-modal-unit">
        </div>

        <div class="form-group">
            <label class="form-label">작업명</label>
            <input type="text" class="form-control" id="task-modal-title-input">
            <div class="field-error" id="task-modal-title-error" style="display:none;"></div>
        </div>

        <div class="form-group">
            <label class="form-label">작업 유형</label>
            <select class="form-select" id="task-modal-type">
                <option value="concept">개념학습 (concept)</option>
                <option value="practice">문제풀이 (practice)</option>
                <option value="review">복습 (review)</option>
                <option value="summary">요약정리 (summary)</option>
                <option value="custom">기타 (custom)</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">중요도</label>
            <div class="segment" data-segment="importance">
                <button type="button" class="opt" data-value="high">HIGH</button>
                <button type="button" class="opt" data-value="medium">MEDIUM</button>
                <button type="button" class="opt" data-value="low">LOW</button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">깊이</label>
            <div class="segment" data-segment="depth">
                <button type="button" class="opt" data-value="core">CORE</button>
                <button type="button" class="opt" data-value="basic">BASIC</button>
                <button type="button" class="opt" data-value="optional">OPTIONAL</button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">난이도</label>
            <div class="segment" data-segment="difficulty">
                <button type="button" class="opt" data-value="easy">EASY</button>
                <button type="button" class="opt" data-value="normal">NORMAL</button>
                <button type="button" class="opt" data-value="hard">HARD</button>
            </div>
        </div>

        <div class="form-error-box" id="task-modal-error" style="display:none; margin-top:10px;"></div>

        <div style="display:flex; gap:8px; margin-top:20px;">
            <button type="button" class="btn btn-ghost" id="task-modal-delete"
                style="color:var(--judge3); border-color:var(--judge3-line); display:none;">삭제</button>
            <button type="button" class="btn btn-ghost" id="task-modal-cancel" style="flex:1;">취소</button>
            <button type="button" class="btn btn-brand" id="task-modal-save" style="flex:1;">저장</button>
        </div>
    </div>
</div>

<script src="{% static 'js/task_api.js' %}"></script>
<script>
    (function () {
        const modal = document.getElementById('task-modal');
        const titleEl = document.getElementById('task-modal-title');
        const subjectEl = document.getElementById('task-modal-subject');
        const unitInput = document.getElementById('task-modal-unit');
        const titleInput = document.getElementById('task-modal-title-input');
        const titleError = document.getElementById('task-modal-title-error');
        const typeSelect = document.getElementById('task-modal-type');
        const errorBox = document.getElementById('task-modal-error');
        const deleteBtn = document.getElementById('task-modal-delete');
        const saveBtn = document.getElementById('task-modal-save');
        const cancelBtn = document.getElementById('task-modal-cancel');

        let currentTaskId = null;   // null이면 추가 모드
        let currentExamId = null;

        function selectSegment(name, value) {
            document.querySelectorAll(`[data-segment="${name}"] .opt`).forEach(o => {
                o.classList.toggle('sel', o.dataset.value === value);
            });
        }
        function getSegmentValue(name) {
            const sel = document.querySelector(`[data-segment="${name}"] .opt.sel`);
            return sel ? sel.dataset.value : null;
        }
        document.querySelectorAll('.segment .opt').forEach(opt => {
            opt.addEventListener('click', () => {
                const group = opt.closest('.segment');
                group.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
                opt.classList.add('sel');
            });
        });

        function resetForm() {
            unitInput.value = '';
            titleInput.value = '';
            typeSelect.value = 'concept';
            selectSegment('importance', 'medium');
            selectSegment('depth', 'basic');
            selectSegment('difficulty', 'normal');
            titleError.style.display = 'none';
            errorBox.style.display = 'none';
        }

        // 전역에 노출 — task_review.html 에서 호출
        window.openTaskModalForCreate = function (examId, subjectName) {
            resetForm();
            currentTaskId = null;
            currentExamId = examId;
            titleEl.textContent = '작업 추가';
            subjectEl.textContent = subjectName;
            deleteBtn.style.display = 'none';
            modal.classList.add('open');
        };

        window.openTaskModalForEdit = function (task) {
            resetForm();
            currentTaskId = task.taskId;
            currentExamId = null;
            titleEl.textContent = '작업 수정';
            subjectEl.textContent = `과목명: ${task.subjectName}`;
            unitInput.value = task.unitName || '';
            titleInput.value = task.title || '';
            typeSelect.value = task.taskType || 'concept';
            selectSegment('importance', task.importance || 'medium');
            selectSegment('depth', task.depth || 'basic');
            selectSegment('difficulty', task.difficulty || 'normal');
            deleteBtn.style.display = '';
            modal.classList.add('open');
        };

        cancelBtn.addEventListener('click', () => modal.classList.remove('open'));

        saveBtn.addEventListener('click', async () => {
            errorBox.style.display = 'none';
            titleError.style.display = 'none';

            const payload = {
                unit_name: unitInput.value || null,
                title: titleInput.value,
                task_type: typeSelect.value,
                importance: getSegmentValue('importance'),
                depth: getSegmentValue('depth'),
                difficulty: getSegmentValue('difficulty'),
            };

            try {
                let result;
                if (currentTaskId === null) {
                    result = await createTask({ exam_id: currentExamId, ...payload });
                    // 성공: 프론트가 반환된 데이터를 작업 목록에 추가 (task_review.html 쪽에서 처리)
                    window.dispatchEvent(new CustomEvent('task-created', { detail: result }));
                } else {
                    result = await updateTask(currentTaskId, payload);
                    window.dispatchEvent(new CustomEvent('task-updated', { detail: result }));
                }
                modal.classList.remove('open');
            } catch (err) {
                // API 명세서의 오류 응답 형식: { isSuccess:false, code, message, result:{ fields:{...} } }
                if (err && err.result && err.result.fields && err.result.fields.title) {
                    titleError.textContent = err.result.fields.title[0];
                    titleError.style.display = 'block';
                } else {
                    errorBox.textContent = (err && err.message) || '요청 처리 중 오류가 발생했습니다.';
                    errorBox.style.display = 'block';
                }
            }
        });

        deleteBtn.addEventListener('click', async () => {
            if (currentTaskId === null) return;
            if (!confirm('이 작업을 삭제할까요?')) return;
            try {
                const result = await deleteTask(currentTaskId);
                window.dispatchEvent(new CustomEvent('task-deleted', { detail: result }));
                modal.classList.remove('open');
            } catch (err) {
                errorBox.textContent = (err && err.message) || '삭제 중 오류가 발생했습니다.';
                errorBox.style.display = 'block';
            }
        });
    })();
</script>
