{% load static %}
{% load exam_extras %}
{% get_wizard_context period exam as wiz %}

<aside class="side">
  <button class="brand" id="toggleSide" type="button" aria-label="사이드바 접기">
    <span class="brand-logo"><img src="{% static 'images/logo-lockup.png' %}" alt="PLAN B"></span>
  </button>

  <nav>
    {% if wiz.period_id %}
    <a class="nav-i {% if nav == 'period_detail' %}on{% endif %}"
       href="{% url 'exams:period_detail' wiz.period_id %}">
      <svg class="ico"><use href="#i-dashboard"/></svg>시험기간 홈
    </a>
    {% endif %}
  </nav>

  <div class="side-label">시험 준비 단계</div>
  <nav class="nav-steps">
    <a class="nav-i nav-step {% if nav == 'period_form' %}on{% endif %}"
       href="{% if wiz.period_id %}{% url 'exams:period_update' wiz.period_id %}{% else %}{% url 'exams:period_create' %}{% endif %}">
      <span class="step-num">1</span>시험기간 등록
    </a>

    <a class="nav-i nav-step {% if nav == 'subject_create' %}on{% endif %}{% if not wiz.period_id %} off{% endif %}"
       href="{% if wiz.period_id %}{% url 'exams:subject_create' wiz.period_id %}{% else %}#{% endif %}">
      <span class="step-num">2</span>과목 등록
    </a>

    <a class="nav-i nav-step {% if nav == 'available_time' %}on{% endif %}{% if not wiz.period_id %} off{% endif %}"
       href="{% if wiz.period_id %}{% url 'exams:available_time_update' wiz.period_id %}{% else %}#{% endif %}">
      <span class="step-num">3</span>공부 가능 시간 등록
    </a>

    <a class="nav-i nav-step {% if nav == 'material' %}on{% endif %}{% if not wiz.first_exam_id %} off{% endif %}"
       href="{% if wiz.first_exam_id %}{% url 'exams:material_create' wiz.first_exam_id %}{% else %}#{% endif %}">
      <span class="step-num">4</span>시험범위 등록
    </a>

    <a class="nav-i nav-step {% if nav == 'task_review' %}on{% endif %}{% if not wiz.first_exam_id %} off{% endif %}"
       href="{% if wiz.first_exam_id %}{% url 'exams:task_review' wiz.first_exam_id %}{% else %}#{% endif %}">
      <span class="step-num">5</span>학습 작업 확인
    </a>

    <a class="nav-i nav-step {% if nav == 'feasibility' %}on{% endif %}{% if not wiz.period_id %} off{% endif %}"
       href="{% if wiz.period_id %}{% url 'planner:feasibility' wiz.period_id %}{% else %}#{% endif %}">
      <span class="step-num">6</span>계획 가능성 판단
    </a>
  </nav>

  <div class="side-foot">
    <form method="post" action="{% url 'accounts:logout' %}" style="margin:0;">
      {% csrf_token %}
      <button type="submit" class="nav-i" style="width:100%; text-align:left;">
        <svg class="ico"><use href="#i-logout"/></svg>
        {{ request.user.nickname|default:request.user.username }} · 로그아웃
      </button>
    </form>
  </div>
</aside>
